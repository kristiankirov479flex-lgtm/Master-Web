<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nail salon – colour scheme shortlist</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  :root { --page: #F2F2F0; --pink: #1d1d1b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Onest", "Segoe UI", system-ui, sans-serif; background: var(--page); color: #222; line-height: 1.55; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  .intro { padding: 40px 0 8px; }
  .intro h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.02em; }
  .intro p { max-width: 62ch; color: #444; }
  .pal { padding: 36px 0 24px; border-top: 1px solid #d5d5d0; }
  .pal h2 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
  .pal .why { margin: 6px 0 18px; color: #444; max-width: 70ch; }
  .rank { display: inline-block; min-width: 2rem; padding: 2px 10px; margin-right: 10px; border-radius: 999px; background: #222; color: #fff; font-size: .9rem; font-weight: 600; text-align: center; }

  /* ---- mock page, themed by CSS variables set from JS ---- */
  .mock { background: var(--bg); color: var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px -12px rgba(0,0,0,.35); }
  .m-top { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  .m-top b { font-size: 1.15rem; letter-spacing: -.01em; }
  .m-top span.nav { color: var(--muted); font-size: .95rem; }
  .m-hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; padding: 8px 24px 32px; align-items: center; }
  .m-hero h3 { margin: 0; font-size: clamp(1.8rem, 3.6vw, 2.8rem); line-height: 1.05; letter-spacing: -.025em; }
  .m-hero p { color: var(--muted); max-width: 40ch; margin: 14px 0 22px; }
  .m-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .b { display: inline-block; padding: 11px 20px; border-radius: 8px; font-weight: 600; font-size: .95rem; border: 1px solid transparent; }
  .b-main { background: var(--accent); color: var(--on-accent); }
  .b-line { border-color: var(--accent); color: var(--accent); }
  .m-photo { height: 300px; border-radius: 10px; background-size: cover; background-position: center; }
  .m-band { background: var(--soft); padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .m-band h4 { margin: 0 0 8px; font-size: 1.1rem; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
  .row span:last-child { font-weight: 600; color: var(--accent); }
  .row small { color: var(--muted); display: block; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tiles div { height: 110px; border-radius: 8px; background-size: cover; background-position: center; }
  .m-dark { background: var(--dark); color: var(--on-dark); padding: 26px 24px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; }
  .m-dark h4 { margin: 0; font-size: 1.3rem; letter-spacing: -.01em; }
  .m-dark p { margin: 4px 0 0; opacity: .85; }
  .b-dark { background: var(--dark-accent); color: var(--dark); }
  .chips { display: flex; gap: 8px; }
  .chips i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--on-dark); display: block; }

  .sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .sw div { background: #fff; border-radius: 8px; padding: 8px; border: 1px solid #dcdcd6; font-size: .82rem; }
  .sw .chip { height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); margin-bottom: 6px; }
  .sw b { display: block; font-size: .85rem; }
  .sw code { color: #555; }
  .ok { color: #1c6b3b; font-weight: 600; }
  .bad { color: #a11; font-weight: 600; }
  @media (max-width: 720px) { .m-hero, .m-band { grid-template-columns: 1fr; } .m-photo { height: 220px; } }
</style>
</head>
<body>
<div class="wrap intro">
  <h1>Colour scheme shortlist</h1>
  <p>Five palettes for the nail salon template, in recommended order. Each is shown on the same mock-up with the same photos, so only the colours change.
  Contrast ratios are calculated live (WCAG: 4.5 or higher for normal text). This page is a working file, not part of the site.</p>
</div>
<main class="wrap" id="list"></main>

<script>
const IMG = '../images/stock/';
const PALETTES = [
  { name: 'Cloud & Rosewater', why: 'Default pick. A warm off-white (a nod to Pantone\'s 2026 colour, the white "Cloud Dancer") with dusty rose. Matches the nude and pink photos. Risk: pink and white is what many salons already use.',
    c: { bg:'#F4F2EE', surface:'#FFFFFF', ink:'#2A2326', muted:'#5E5559', accent:'#96445A', 'on-accent':'#FFFFFF', soft:'#EBDCD6', dark:'#3A2430', 'on-dark':'#F4E9E6', 'dark-accent':'#E6B8B8' } },
  { name: 'Sage & Stone', why: 'Calm deep green on stone. Green is among the fall 2026 nail shades, it suits the "calm and trust" tone, and it stands out from pink salons. Green and pink photos complement each other.',
    c: { bg:'#F3F4EF', surface:'#FFFFFF', ink:'#1F2A25', muted:'#55615B', accent:'#3E5F4F', 'on-accent':'#FFFFFF', soft:'#DCE4D8', dark:'#24352D', 'on-dark':'#EAF0E8', 'dark-accent':'#C7D8BD' } },
  { name: 'Espresso & Cream', why: 'Warm cream with chocolate brown. Brown and espresso are the headline polish shades for fall and winter 2026, and the palette reads grown-up and editorial. Works well with the moody photos.',
    c: { bg:'#F8F2EA', surface:'#FFFFFF', ink:'#2B1D18', muted:'#665349', accent:'#6B3F2B', 'on-accent':'#FFFFFF', soft:'#EADBCB', dark:'#3A2620', 'on-dark':'#F6ECE2', 'dark-accent':'#E2B98E' } },
  { name: 'Oxblood & Blush', why: 'Deep burgundy on blush. Oxblood and wine reds lead the autumn and winter trend lists. More feminine and glamorous than the others, and still readable.',
    c: { bg:'#FBF4F2', surface:'#FFFFFF', ink:'#2B1519', muted:'#6A5055', accent:'#7B1E2E', 'on-accent':'#FFFFFF', soft:'#F0D9D8', dark:'#3B141C', 'on-dark':'#FBEDEA', 'dark-accent':'#E8B7A8' } },
  { name: 'Midnight & Champagne', why: 'Midnight navy with champagne gold on ivory. Reads premium and trustworthy, and is the strongest contrast to pink-and-white competitors. Midnight navy appears in winter trend coverage.',
    c: { bg:'#F7F4EE', surface:'#FFFFFF', ink:'#14213D', muted:'#4F5A70', accent:'#14213D', 'on-accent':'#FFFFFF', soft:'#E7E1D3', dark:'#101B2D', 'on-dark':'#EEF0F4', 'dark-accent':'#D4B27A' } }
];

function lum(h){ h=h.slice(1); const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  return 0.2126*f(parseInt(h.slice(0,2),16))+0.7152*f(parseInt(h.slice(2,4),16))+0.0722*f(parseInt(h.slice(4,6),16)); }
function ratio(a,b){ let x=lum(a), y=lum(b); if(x<y)[x,y]=[y,x]; return (x+0.05)/(y+0.05); }

const PAIRS = [['Text on page','ink','bg'],['Grey text on page','muted','bg'],['Button text on button','on-accent','accent'],['Links / accent on page','accent','bg'],['Accent on tinted band','accent','soft'],['Text on dark band','on-dark','dark'],['Button on dark band','dark','dark-accent']];

const list = document.getElementById('list');
PALETTES.forEach((p, i) => {
  const s = document.createElement('section'); s.className = 'pal';
  const vars = Object.entries(p.c).map(([k,v]) => `--${k}:${v}`).join(';');
  const swatches = Object.entries(p.c).map(([k,v]) => `<div><div class="chip" style="background:${v}"></div><b>${k}</b><code>${v}</code></div>`).join('');
  const checks = PAIRS.map(([label,a,b]) => { const r = ratio(p.c[a], p.c[b]); return `<div><b>${label}</b><span class="${r>=4.5?'ok':'bad'}">${r.toFixed(2)} : 1 ${r>=4.5?'pass':'FAIL'}</span></div>`; }).join('');
  s.innerHTML = `
    <h2><span class="rank">${i+1}</span>${p.name}</h2>
    <p class="why">${p.why}</p>
    <div class="mock" style="${vars}">
      <div class="m-top"><b>Studio Name</b><span class="nav">Services · Gallery · Prices · Contact</span></div>
      <div class="m-hero">
        <div>
          <h3>Nails that feel like you.</h3>
          <p>Gel, extensions and nail art in a calm, clean studio. See the work, check the prices, send a request.</p>
          <div class="m-btns"><span class="b b-main">Request an appointment</span><span class="b b-line">Call us</span></div>
        </div>
        <div class="m-photo" style="background-image:url(${IMG}hero-light-pink.jpg)"></div>
      </div>
      <div class="m-band">
        <div><h4>Popular services</h4>
          <div class="row"><span>Gel polish manicure<small>1 h – 1 h 30</small></span><span>25 €</span></div>
          <div class="row"><span>Gel nail extensions<small>2 h – 3 h</small></span><span>from 40 €</span></div>
          <div class="row"><span>Gel polish pedicure<small>1 h – 1 h 30</small></span><span>25–30 €</span></div></div>
        <div class="tiles"><div style="background-image:url(${IMG}black-tortoiseshell.jpg)"></div><div style="background-image:url(${IMG}mauve-glitter.jpg)"></div><div style="background-image:url(${IMG}polish-bottles-shelves.jpg)"></div></div>
      </div>
      <div class="m-dark"><div><h4>Pick your shade</h4><p>Choose a colour and see the page change.</p></div>
        <div class="chips"><i style="background:${p.c['dark-accent']}"></i><i style="background:${p.c.accent}"></i><i style="background:${p.c.soft}"></i></div>
        <span class="b b-dark">Book now</span></div>
    </div>
    <div class="sw">${swatches}</div>
    <div class="sw">${checks}</div>`;
  list.appendChild(s);
});
</script>
</body>
</html>
